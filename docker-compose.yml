services:
  app:
    build: .
    image: course-registration-system:latest
    restart: unless-stopped
    environment:
      DAO_SQLITE_PATH: /app/data/app.db
    volumes:
      - ./data:/app/data
    # Only reachable through nginx, not published on the host
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
